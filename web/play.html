<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Play · Game Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#241c14; }
    html, body { margin:0; height:100%; background:#1c1712; color:#f4ead7; font-family:"IBM Plex Sans",sans-serif; }
    .wrap { max-width:980px; margin:0 auto; padding:16px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:12px; margin-bottom:10px; }
    h1 { font-family:Fraunces,serif; margin:0; font-size:1.6rem; }
    a { color:#f4ead7; }
    canvas { width:100%; height:auto; background:#000; border:3px solid #f4ead7; display:block; touch-action:none; }
    .hud-sub { opacity:.8; margin:4px 0 0; }
    .touch { display:flex; gap:8px; margin-top:10px; }
    .touch button {
      flex:1; padding:14px; font:inherit; background:#f4ead7; color:#241c14; border:0; font-weight:700;
    }
    .overlay {
      position:fixed; inset:0; display:none; place-items:center; background:rgba(28,23,18,.72); z-index:5;
    }
    .overlay.show { display:grid; }
    .card { background:#f4ead7; color:#241c14; padding:24px; min-width:260px; text-align:center; position:relative; z-index:6; }
    .card button { margin-top:12px; padding:10px 16px; font:inherit; border:2px solid #241c14; background:#3f5c39; color:#f4ead7; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1 id="title">Loading…</h1>
        <p class="hud-sub" id="sub"></p>
      </div>
      <a href="/">← new idea</a>
    </header>
    <canvas id="game" width="960" height="540"></canvas>
    <div class="touch" id="touch"></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h2 id="end-title"></h2>
      <p id="end-body"></p>
      <button type="button" id="retry">Play again</button>
    </div>
  </div>
  <script src="/play.js"></script>
</body>
</html>
